run_name: baseline_v2

description: >
  Frontier conversational benchmark across modern open-weight
  conversational and RP-oriented models focused on emotional realism,
  escalation pacing, explicit compliance, stylistic adaptation,
  conversational immersion, and long-context interaction quality.

models:

  - name: Kimi-K2.6
    model_id: moonshotai/kimi-k2
    provider: openrouter

    params:
      temperature: 0.70
      top_p: 0.90
      max_tokens: 850

    enabled: true

  - name: DeepSeek-V4-Pro
    model_id: deepseek/deepseek-v4-pro
    provider: openrouter

    params:
      temperature: 0.82
      top_p: 0.92
      max_tokens: 850

    enabled: true

  - name: Lunaris-8B
    model_id: sao10k/l3-lunaris-8b
    provider: openrouter

    params:
      temperature: 0.90
      top_p: 0.95
      max_tokens: 850

    enabled: true

  - name: UnslopNemo-12B
    model_id: thedrummer/unslopnemo-12b
    provider: openrouter

    params:
      temperature: 0.88
      top_p: 0.92
      max_tokens: 850

    enabled: true

  - name: Cydonia-24B
    model_id: thedrummer/cydonia-24b-v4.1
    provider: openrouter

    params:
      temperature: 0.92
      top_p: 0.95
      max_tokens: 850

    enabled: true 

  - name: Hermes-3-70B
    model_id: nousresearch/hermes-3-llama-3.1-70b
    provider: openrouter

    params:
      temperature: 0.8
      top_p: 0.95
      max_tokens: 850
      presence_penalty: 0.2

    enabled: true

  - name: Euryale-70B
    model_id: sao10k/l3.3-euryale-70b
    provider: openrouter

    params:
      temperature: 0.90
      top_p: 0.95
      max_tokens: 850
      repetition_penalty: 1.08

    enabled: true 

dataset:
  path: ./data/eval_dataset_v1.jsonl

  shuffle: true
  shuffle_seed: 42

  max_prompts: null

  filter_tags: []

  filter_difficulty:
    - easy
    - medium
    - hard

  runtime:
    parallel_requests: 5
    max_generation_retries: 1
    generation_timeout_seconds: 90

output_dir: ./reports

dry_run: false