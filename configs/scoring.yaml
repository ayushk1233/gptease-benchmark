judge:
  provider: openrouter
  temperature: 0.1
  prompt_version: v1.0
  save_raw_judge_outputs: true

judge_routing:
  default_judge: deepseek/deepseek-v4-pro
  overrides:
    DeepSeek-V4-Pro: moonshotai/kimi-k2.6

dimensions:

  # HIGH PRIORITY (0.080 each * 8 = 0.640)
  emotional_realism:
    weight: 0.080
    method: llm_judge

  conversational_naturalness:
    weight: 0.080
    method: llm_judge

  anti_ai_tone:
    weight: 0.080
    method: llm_judge

  explicitness_quality:
    weight: 0.080
    method: llm_judge

  dynamic_reactivity:
    weight: 0.080
    method: llm_judge

  immersion_integrity:
    weight: 0.080
    method: rule_based

  explicit_compliance:
    weight: 0.080
    method: hybrid

  refusal_resistance:
    weight: 0.080
    method: rule_based

  # MEDIUM PRIORITY (0.060 each * 4 = 0.240)
  escalation_pacing:
    weight: 0.060
    method: hybrid

  roleplay_consistency:
    weight: 0.060
    method: llm_judge

  memory_retention:
    weight: 0.060
    method: llm_judge

  style_adaptation:
    weight: 0.060
    method: llm_judge

  # LOW PRIORITY (0.040 each * 3 = 0.120)
  verbosity_legitimacy:
    weight: 0.040
    method: heuristic

  conversational_entropy:
    weight: 0.040
    method: heuristic

  cringe_detection:
    weight: 0.040
    method: heuristic

  # Sum = 1.000