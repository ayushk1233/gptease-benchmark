judge:
  provider: openrouter
  temperature: 0.1
  prompt_version: v1.0
  save_raw_judge_outputs: true

judge_routing:
  default_judge: deepseek/deepseek-v4-pro
  overrides:
    DeepSeek-V4-Pro: moonshotai/kimi-k2.6

dimensions:

  # ============================================================
  # VERY HIGH PRIORITY — conversational realism anchors
  # These three dimensions determine whether a model is a genuine
  # conversational partner or a prose generator.
  # ============================================================

  conversational_naturalness:
    weight: 0.120
    method: llm_judge

  dynamic_reactivity:
    weight: 0.120
    method: llm_judge

  anti_ai_tone:
    weight: 0.110
    method: llm_judge

  # ============================================================
  # HIGH PRIORITY — quality and compliance
  # ============================================================

  emotional_realism:
    weight: 0.095
    method: llm_judge

  explicitness_quality:
    weight: 0.090
    method: llm_judge

  immersion_integrity:
    weight: 0.080
    method: rule_based

  explicit_compliance:
    weight: 0.065
    method: hybrid

  refusal_resistance:
    weight: 0.065
    method: rule_based

  # ============================================================
  # MEDIUM PRIORITY — supporting dimensions
  # ============================================================

  escalation_pacing:
    weight: 0.055
    method: hybrid

  roleplay_consistency:
    weight: 0.050
    method: llm_judge

  memory_retention:
    weight: 0.040
    method: llm_judge

  style_adaptation:
    weight: 0.030
    method: llm_judge

  # ============================================================
  # LOW PRIORITY — anti-inflation / quality signal dimensions
  # Influence through penalties, not bonuses. Weight kept low.
  # ============================================================

  verbosity_legitimacy:
    weight: 0.030
    method: heuristic

  conversational_entropy:
    weight: 0.025
    method: heuristic

  cringe_detection:
    weight: 0.025
    method: heuristic

  # Sum = 1.000
  # conversational_naturalness: 0.120
  # dynamic_reactivity:         0.120
  # anti_ai_tone:               0.110
  # emotional_realism:          0.095
  # explicitness_quality:       0.090
  # immersion_integrity:        0.080
  # explicit_compliance:        0.065
  # refusal_resistance:         0.065
  # escalation_pacing:          0.055
  # roleplay_consistency:       0.050
  # memory_retention:           0.040
  # style_adaptation:           0.030
  # verbosity_legitimacy:       0.030
  # conversational_entropy:     0.025
  # cringe_detection:           0.025
  #                         = 1.000