providers:
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

    timeout_seconds: 180
    max_retries: 3
    concurrency_limit: 10

    pricing:
      default:
        cost_per_1k_input: 0.000001   # $0.001/M — fallback
        cost_per_1k_output: 0.000001

      models:
        sao10k/l3.3-euryale-70b:
          cost_per_1k_input: 0.0009    # $0.90/M
          cost_per_1k_output: 0.0009

        nousresearch/hermes-3-llama-3.1-70b:
          cost_per_1k_input: 0.00088   # $0.88/M
          cost_per_1k_output: 0.00088

        thedrummer/cydonia-24b-v4.1:
          cost_per_1k_input: 0.00035   # $0.35/M
          cost_per_1k_output: 0.00035

        thedrummer/unslopnemo-12b:
          cost_per_1k_input: 0.00012   # $0.12/M
          cost_per_1k_output: 0.00012

        sao10k/l3-lunaris-8b:
          cost_per_1k_input: 0.00004   # $0.04/M
          cost_per_1k_output: 0.00004

        moonshotai/kimi-k2:
          cost_per_1k_input: 0.00014   # $0.14/M
          cost_per_1k_output: 0.00059  # $0.59/M

        deepseek/deepseek-v4-pro:
          cost_per_1k_input: 0.00027   # $0.27/M
          cost_per_1k_output: 0.00110  # $1.10/M

  together_ai:
    name: together_ai
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_AI_API_KEY

    timeout_seconds: 180
    max_retries: 3
    concurrency_limit: 5

    pricing:
      default:
        cost_per_1k_input: 0.90
        cost_per_1k_output: 0.90

  featherless:
    name: featherless
    base_url: https://api.featherless.ai/v1
    api_key_env: FEATHERLESS_API_KEY

    timeout_seconds: 180
    max_retries: 3
    concurrency_limit: 2

    pricing:
      default:
        cost_per_1k_input: 0.25
        cost_per_1k_output: 0.25