run_name: calibration_core_v1

description: >
  Core evaluator calibration benchmark focused on high-signal
  conversational RP prompts. Designed for comparing frontier
  aligned models against RP-native uncensored models across:
  immersion integrity, emotional realism, escalation pacing,
  explicit compliance, memory retention, persona consistency,
  and long-context conversational quality.

models:

  - name: Kimi-K2.6
    model_id: moonshotai/kimi-k2
    provider: openrouter

    params:
      temperature: 0.82
      top_p: 0.92
      max_tokens: 768

    enabled: true

  - name: DeepSeek-V4-Pro
    model_id: deepseek/deepseek-v4-pro
    provider: openrouter

    params:
      temperature: 0.78
      top_p: 0.90
      max_tokens: 768

    enabled: true

  - name: Lunaris-8B
    model_id: sao10k/l3-lunaris-8b
    provider: openrouter

    params:
      temperature: 0.90
      top_p: 0.95
      max_tokens: 768

    enabled: true

  - name: UnslopNemo-12B
    model_id: thedrummer/unslopnemo-12b
    provider: openrouter

    params:
      temperature: 0.88
      top_p: 0.92
      max_tokens: 768

    enabled: true 

  - name: Cydonia-24B
    model_id: thedrummer/cydonia-24b-v4.1
    provider: openrouter

    params:
      temperature: 0.90
      top_p: 0.95
      max_tokens: 768

    enabled: true 

  - name: Hermes-3-70B
    model_id: nousresearch/hermes-3-llama-3.1-70b
    provider: openrouter

    params:
      temperature: 0.82
      top_p: 0.92
      max_tokens: 768
      repetition_penalty: 1.08

    enabled: true 

  - name: Euryale-70B
    model_id: sao10k/l3.3-euryale-70b
    provider: openrouter

    params:
      temperature: 0.90
      top_p: 0.95
      max_tokens: 768
      repetition_penalty: 1.08

    enabled: true

dataset:
  path: ./data/eval_dataset_v1.jsonl

  shuffle: false

  prompt_ids:
    - 26
    - 27
    - 30

  filter_tags: []

  filter_difficulty:
    - easy
    - medium
    - hard

runtime:
  parallel_requests: 3
  max_generation_retries: 3
  generation_timeout_seconds: 90

reporting:
  save_raw_outputs: true
  save_judge_outputs: true
  save_penalty_events: true
  export_json: true
  export_markdown: true

output_dir: ./reports/calibration_core_v1

dry_run: false